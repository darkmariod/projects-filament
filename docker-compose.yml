# ============================================================
# Docker Compose — Sistema Garantías
# ============================================================

services:
  # -----------------------------------------------------------
  # Main application: Nginx + PHP-FPM + Cron
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garantias-app
    ports:
      # Sin proxy delante, poner APP_PORT=80 en .env y todo -panel y agente-
      # responde por el mismo puerto. El 8081 queda como valor por defecto
      # para el servidor actual, que tiene Traefik en el 80.
      - "${APP_PORT:-8081}:80"
    env_file:
      - .env
    environment:
      DB_HOST: garantias-mysql
      DB_USERNAME: garantias_user
      TZ: ${TZ:-America/Guayaquil}
    networks:
      default:
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - garantias-storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # Queue worker (same image, runs artisan queue:work)
  # -----------------------------------------------------------
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garantias-queue
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --queue=default,print,emails
    env_file:
      - .env
    environment:
      DB_HOST: garantias-mysql
      DB_USERNAME: garantias_user
      TZ: ${TZ:-America/Guayaquil}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - garantias-storage:/var/www/html/storage
    restart: unless-stopped

  # -----------------------------------------------------------
  # MySQL 8 database
  # -----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: garantias-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_garantias}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_changeme}
      MYSQL_USER: garantias_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      TZ: ${TZ:-America/Guayaquil}
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - default
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
    name: garantias-mysql-data
  garantias-storage:
    name: garantias-app-storage

networks: {}
